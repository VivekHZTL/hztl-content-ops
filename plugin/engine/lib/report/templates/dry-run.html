<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dry run</title><style>/*__CSS__*/</style></head><body><div class="wrap">
<h1 id="title"></h1><p class="muted" id="sub"></p><div class="counts" id="counts"></div>
<div class="tabs" role="tablist"><button data-tab="pending" aria-selected="true">Pending &amp; skipped</button><button data-tab="diff">Page diff</button><button data-tab="pages">All pages</button><button data-tab="sources">Sources</button></div>
<section id="pending"></section><section id="diff" hidden></section><section id="pages" hidden></section><section id="sources" hidden></section>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.title=D.title;document.getElementById('title').textContent=D.title;document.getElementById('sub').textContent=`Environment ${D.env}${D.host?' · '+D.host:''} · ${D.createdAt} · nothing was written`;
document.getElementById('counts').innerHTML=['ready','up-to-date','needs-review','no-match'].map(k=>`<div><b>${D.counts[k]||0}</b>${k}</div>`).join('');
const byCat={};for(const p of D.pending)(byCat[p.category]??=[]).push(p);
document.getElementById('pending').innerHTML=Object.keys(byCat).length?Object.entries(byCat).map(([k,rows])=>{const c=D.categories[k]||{title:k,next:''};return`<div class="card"><h2>${esc(c.title)} <span class="muted">(${rows.length})</span></h2><p class="next">${esc(c.next)}</p><button class="copy" data-cat="${esc(k)}">Copy as CSV</button><div class="tbl"><table><tr><th>Page</th><th>Where</th><th>Locator</th><th>Note</th></tr>${rows.map(r=>`<tr><td>${esc(r.page)}</td><td>${esc(r.where||'')}</td><td><code>${esc(r.locator||'')}</code></td><td>${esc(r.text||'')}</td></tr>`).join('')}</table></div></div>`}).join(''):'<p class="muted">Nothing pending.</p>';
document.getElementById('diff').innerHTML=D.pages.filter(p=>p.status==='ready').map(p=>`<div class="card"><h2>${esc(p.key)} <span class="pill ${p.status}">${p.status}</span></h2><p class="muted">${esc(p.path||'')}</p>${p.kind==='items'&&!p.before.length&&!p.after.length?'':`<p><b>Components now:</b> ${p.before.map(esc).join(' → ')||'—'}<br><b>After:</b> ${p.after.map(esc).join(' → ')||'—'}${p.creates.length?`<br><b>New items:</b> ${p.creates.map(esc).join(', ')}`:''}</p>`}${p.changes.length?`<p><b>Steps, in order:</b></p><ol>${p.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:''}${p.fields.length?`<div class="tbl"><table><tr><th>Item</th><th>Field</th><th>Now</th><th>After</th></tr>${p.fields.map(f=>`<tr><td>${esc(f.ref)}</td><td>${esc(f.field)}</td><td>${esc(f.from)}</td><td>${esc(f.to)}</td></tr>`).join('')}</table></div>`:''}</div>`).join('')||'<p class="muted">No ready pages.</p>';
document.getElementById('pages').innerHTML=`<div class="tbl"><table><tr><th>Page</th><th>Status</th><th>Reasons</th><th>Creates</th><th>Updates</th><th>Layout</th><th>Pending</th></tr>${D.pages.map(p=>`<tr><td>${esc(p.key)}<br><span class="muted">${esc(p.path||'')}</span></td><td><span class="pill ${p.status}">${p.status}</span></td><td>${p.reasons.map(esc).join('<br>')}</td><td>${p.creates.length}</td><td>${p.updates}</td><td>${p.layout?'yes':''}</td><td>${p.pending.length}</td></tr>`).join('')}</table></div>`;
document.getElementById('sources').innerHTML=`<div class="tbl"><table><tr><th>File</th><th>Hash</th></tr>${D.sources.map(s=>`<tr><td>${esc(s.file)}</td><td><code>${esc((s.sha256||'').slice(0,12))}</code></td></tr>`).join('')}</table></div>`;
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab)}));
document.querySelectorAll('button.copy').forEach(b=>b.addEventListener('click',()=>{const rows=byCat[b.dataset.cat]||[];const csv=['page,where,locator,note',...rows.map(r=>[r.page,r.where,r.locator,r.text].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','))].join('\n');try{navigator.clipboard.writeText(csv).then(()=>{b.textContent='Copied'});}catch{b.textContent='Select and copy the table'}}));
</script></div></body></html>
