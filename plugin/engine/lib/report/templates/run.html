<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run</title><style>/*__CSS__*/</style></head><body><div class="wrap">
<h1 id="title"></h1><p class="muted" id="sub"></p><div class="counts" id="counts"></div>
<div class="tabs" role="tablist"><button data-tab="written" aria-selected="true">Written</button><button data-tab="notwritten">Not written</button><button data-tab="pending">Still pending</button><button data-tab="recheck">Re-check</button></div>
<section id="written"></section><section id="notwritten" hidden></section><section id="pending" hidden></section><section id="recheck" hidden></section>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.title=D.title;document.getElementById('title').textContent=D.title;document.getElementById('sub').textContent=`Run ${D.runId} · apply ${D.applyId} · environment ${D.env}${D.host?' · '+D.host:''}${D.stoppedEarly?' · '+D.stoppedEarly:''} · nothing is published`;
document.getElementById('counts').innerHTML=Object.entries(D.counts).map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('');
document.getElementById('written').innerHTML=D.written.length?D.written.map(r=>`<div class="card"><h2>${esc(r.key)} <span class="pill done">done</span></h2><p class="muted">${esc(r.page.path||'')}</p><p>${(r.page.after||[]).length?`<b>Components:</b> ${(r.page.after||[]).map(esc).join(' → ')}`:''}${r.created&&Object.keys(r.created).length?`<br><b>Created:</b> ${Object.entries(r.created).map(([k,v])=>esc(k.replace('new:','')+' '+v)).join(', ')}`:''}</p>${(r.page.changes||[]).length?`<p><b>Steps written, in order:</b></p><ol>${r.page.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:''}${(r.page.fields||[]).length?`<div class="tbl"><table><tr><th>Item</th><th>Field</th><th>Before</th><th>Written</th></tr>${r.page.fields.map(f=>`<tr><td>${esc(f.ref)}</td><td>${esc(f.field)}</td><td>${esc(f.from)}</td><td>${esc(f.to)}</td></tr>`).join('')}</table></div>`:''}<p class="muted">Undo this page: <code>${esc(r.undo)}</code></p></div>`).join(''):'<p class="muted">No pages were written.</p>';
document.getElementById('notwritten').innerHTML=`<h2>Not written</h2>`+(D.notWritten.length||D.notStarted.length?`<div class="tbl"><table><tr><th>Page</th><th>Status</th><th>Why</th></tr>${D.notWritten.map(r=>`<tr><td>${esc(r.key)}</td><td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td><td>${esc(r.error||'')}${(r.verify||[]).map(v=>'<br>'+esc(v)).join('')}</td></tr>`).join('')}${D.notStarted.map(r=>`<tr><td>${esc(r.key)}</td><td><span class="pill skipped">not started</span></td><td>Stopped before this page</td></tr>`).join('')}</table></div>`:'<p class="muted">Every selected page was written.</p>');
document.getElementById('pending').innerHTML=D.pending.length?`<div class="tbl"><table><tr><th>Page</th><th>Category</th><th>Locator</th><th>Note</th><th>Next</th></tr>${D.pending.map(p=>`<tr><td>${esc(p.page)}</td><td>${esc((D.categories[p.category]||{}).title||p.category)}</td><td><code>${esc(p.locator||'')}</code></td><td>${esc(p.text||'')}</td><td class="muted">${esc((D.categories[p.category]||{}).next||'')}</td></tr>`).join('')}</table></div>`:'<p class="muted">Nothing pending on the written pages.</p>';
document.getElementById('recheck').innerHTML=D.recheck?`<p>${D.recheck.upToDate} of ${D.recheck.checked} written pages re-plan as up to date.</p>${(D.recheck.pages||[]).filter(p=>p.status!=='up-to-date').map(p=>`<div class="card"><b>${esc(p.key)}</b> <span class="pill ${esc(p.status)}">${esc(p.status)}</span><br>${(p.reasons||[]).map(esc).join('<br>')}${(p.fieldsOff||[]).length?'<br>Fields off: '+p.fieldsOff.map(esc).join(', '):''}</div>`).join('')}`:'<p class="muted">No verify result saved for this apply. Run <code>content-ops verify --run … --apply …</code>.</p>';
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab)}));
</script></div></body></html>
