<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" role="img" aria-labelledby="t2 d2">
  <title id="t2">Content Ops daily loop</title>
  <desc id="d2">Five steps top to bottom: sources, content JSON, plan, apply, verify.</desc>
  <style>
    .dg text { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .dg .h { font-size: 14px; font-weight: 500; }
    .dg .s { font-size: 12px; }
    .dg line { stroke: var(--d-line, #888780); stroke-width: 1.5; }
  </style>
  <defs><marker id="dl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g class="dg">
    <rect x="190" y="40" width="300" height="56" rx="8" fill="var(--d-gray-bg, #F1EFE8)" stroke="var(--d-gray-line, #5F5E5A)" stroke-width="0.5"/>
    <text class="h" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="var(--d-gray-ink, #444441)">1. Sources</text>
    <text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central" fill="var(--d-gray-sub, #5F5E5A)">xlsx, docx, live site, Figma, existing pages</text>
    <line x1="340" y1="96" x2="340" y2="124" marker-end="url(#dl-arrow)"/>
    <rect x="190" y="130" width="300" height="56" rx="8" fill="var(--d-teal-bg, #E1F5EE)" stroke="var(--d-teal-line, #0F6E56)" stroke-width="0.5"/>
    <text class="h" x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="var(--d-teal-ink, #085041)">2. Content JSON + flags</text>
    <text class="s" x="340" y="168" text-anchor="middle" dominant-baseline="central" fill="var(--d-teal-sub, #0F6E56)">One file per page. Unsure bits flagged, never fixed</text>
    <line x1="340" y1="186" x2="340" y2="214" marker-end="url(#dl-arrow)"/>
    <rect x="190" y="220" width="300" height="56" rx="8" fill="var(--d-teal-bg, #E1F5EE)" stroke="var(--d-teal-line, #0F6E56)" stroke-width="0.5"/>
    <text class="h" x="340" y="238" text-anchor="middle" dominant-baseline="central" fill="var(--d-teal-ink, #085041)">3. Plan · dry run</text>
    <text class="s" x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="var(--d-teal-sub, #0F6E56)">Report shows every change. You review here</text>
    <line x1="340" y1="276" x2="340" y2="304" marker-end="url(#dl-arrow)"/>
    <rect x="190" y="310" width="300" height="56" rx="8" fill="var(--d-coral-bg, #FAECE7)" stroke="var(--d-coral-line, #993C1D)" stroke-width="0.5"/>
    <text class="h" x="340" y="328" text-anchor="middle" dominant-baseline="central" fill="var(--d-coral-ink, #712B13)">4. Apply · asks first</text>
    <text class="s" x="340" y="348" text-anchor="middle" dominant-baseline="central" fill="var(--d-coral-sub, #993C1D)">Journal, read-back, auto-rollback on mismatch</text>
    <line x1="340" y1="366" x2="340" y2="394" marker-end="url(#dl-arrow)"/>
    <rect x="190" y="400" width="300" height="56" rx="8" fill="var(--d-purple-bg, #EEEDFE)" stroke="var(--d-purple-line, #534AB7)" stroke-width="0.5"/>
    <text class="h" x="340" y="418" text-anchor="middle" dominant-baseline="central" fill="var(--d-purple-ink, #3C3489)">5. Verify · Undo · Publish</text>
    <text class="s" x="340" y="438" text-anchor="middle" dominant-baseline="central" fill="var(--d-purple-sub, #534AB7)">Re-plan says up-to-date. Publish is its own ask</text>
  </g>
</svg>
